<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D42127">
<title>Pensell Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: sticky white header carrying the Pensell wordmark, tab rail, one working column; sheets slide up for editing */
:root{
  --bg:#F6F4F4; --surface:#FFFFFF; --ink:#3B3436; --ink-strong:#231E1F; --muted:#7A7072; --line:#E6E0E0;
  --accent:#D42127; --accent-ink:#FFFFFF; --accent-soft:#FBE7E7; --char:#3B3436; --char-ink:#FFFFFF;
  --gold:#A86A00; --gold-soft:#FBF0D9; --good:#1D7A48; --good-soft:#E1F2E8; --bad:#C0262C; --bad-soft:#FBE4E4; --shade:rgba(35,30,31,.45);
  --logo-l:block; --logo-d:none;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171314; --surface:#221D1E; --ink:#EDE7E7; --ink-strong:#FFFFFF; --muted:#A99FA0; --line:#3A3233;
  --accent:#F0443C; --accent-ink:#FFFFFF; --accent-soft:#3D1F1F; --char:#EDE7E7; --char-ink:#221D1E;
  --gold:#E5B04D; --gold-soft:#3A2E17; --good:#5CC98A; --good-soft:#163526; --bad:#F0726B; --bad-soft:#3D1D1D; --shade:rgba(0,0,0,.6);
  --logo-l:none; --logo-d:block; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171314; --surface:#221D1E; --ink:#EDE7E7; --ink-strong:#FFFFFF; --muted:#A99FA0; --line:#3A3233;
  --accent:#F0443C; --accent-ink:#FFFFFF; --accent-soft:#3D1F1F; --char:#EDE7E7; --char-ink:#221D1E;
  --gold:#E5B04D; --gold-soft:#3A2E17; --good:#5CC98A; --good-soft:#163526; --bad:#F0726B; --bad-soft:#3D1D1D; --shade:rgba(0,0,0,.6);
  --logo-l:none; --logo-d:block; color-scheme:dark}
html,body{background:var(--bg);margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.brand img{height:28px;width:auto}
.logo-l{display:var(--logo-l)} .logo-d{display:var(--logo-d)}
.brand small{font-size:12px;color:var(--muted);border-inline-start:1px solid var(--line);padding-inline-start:12px}
.month{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.month button{border:0;background:transparent;color:var(--ink);font-size:18px;width:32px;height:32px;border-radius:8px;cursor:pointer}
.month button:hover{background:var(--surface);color:var(--accent)}
.month span{font-family:var(--display);font-weight:600;min-width:118px;text-align:center}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--muted);font:500 14px var(--body);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink-strong);border-bottom-color:var(--accent);font-weight:600}
main{padding-block:20px 60px}
h2{font-family:var(--display);font-size:20px;margin:0;text-wrap:balance;color:var(--ink-strong)}
h3{font-family:var(--display);font-size:16px;margin:0;color:var(--ink-strong)}
h4{font-size:14px;margin:0;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.02em;color:var(--muted);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--body);padding:8px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dark{background:var(--char);color:var(--char-ink);border-color:var(--char)}
.btn.good{background:#1FA855;color:#fff;border-color:#1FA855}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile b{display:block;font-family:var(--display);font-size:22px;margin-top:4px;color:var(--ink-strong)}
.tile.hl{background:var(--char);border-color:var(--char);color:var(--char-ink)}
.tile.hl b,.tile.hl .label{color:var(--char-ink)}
.tile.hl .label{opacity:.75}
.tile.red b{color:var(--accent)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item .grow,.grow{flex:1;min-width:150px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.paid{background:var(--good-soft);color:var(--good)}
.pill.unpaid{background:var(--gold-soft);color:var(--gold)}
.pill.none{background:var(--bg);color:var(--muted)}
.pill.red{background:var(--accent-soft);color:var(--accent)}
.pkg{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.pkg.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.demo{font-size:11px;background:var(--gold-soft);color:var(--gold);padding:1px 7px;border-radius:6px;margin-inline-start:6px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 16px;margin-top:12px}
.legend div{display:flex;gap:8px;align-items:center;font-size:13px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span:last-child{margin-inline-start:auto}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);padding:0}
textarea{resize:vertical;min-height:40px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;font:500 13px var(--body);color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink-strong);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button.on.a{color:var(--bad)}
.seg button.on.p{color:var(--good)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h3{margin-bottom:6px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px}
.notice{background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}
.sec{border:1px solid var(--line);border-radius:12px;padding:14px}
.sec.off{background:var(--bg)}
.sec-h{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sec-h label{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;cursor:pointer}
details.pct summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:500;margin-top:10px}
details.pct[open] summary{margin-bottom:10px}
.mini{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px}
.mini span:nth-child(even){text-align:left}
.mini .tot{font-weight:600;border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
.lst{display:flex;flex-direction:column;gap:6px}
.lst .r{display:flex;gap:6px}
.lst .r>*{flex:1}
.lst .r .x,.lst .r input[type=number]{flex:0 0 auto}
.lst .r input[type=number]{width:80px}
/* sheet */
.shade{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
@media(min-width:800px){.shade{align-items:center}.sheet{border-radius:18px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.x{border:0;background:var(--bg);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
/* invoice paper: always a white printed document */
.paper{background:#FFFFFF;color:#3B3436;border:1px solid #E6E0E0;border-radius:14px;overflow:hidden}
.paper-h{padding:20px 18px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:4px solid #D42127}
.paper-h img{height:30px;width:auto}
.paper-h .meta{text-align:left;font-size:13px;color:#7A7072}
.paper-h .meta b{color:#231E1F}
.paper-b{padding:16px 18px}
.paper table th,.paper table td{border-color:#EEE8E8}
.paper th{color:#7A7072}
.paper .lbl{font-size:12px;color:#7A7072}
.paper .desc{font-size:12px;color:#7A7072}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #231E1F;padding-top:10px;margin-top:6px}
.total b{font-family:var(--display);font-size:24px;color:#D42127}
.pay{display:grid;gap:8px;margin-top:14px}
.payrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#F6F4F4;border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.payrow b{font-family:var(--display);color:#231E1F}
.payrow .btn{background:#FFFFFF;color:#3B3436;border-color:#E6E0E0}
.payrow .btn.primary{background:#D42127;color:#fff;border-color:#D42127}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--char);color:var(--char-ink);padding:10px 16px;border-radius:10px;z-index:40;font-size:14px}
.emp-card summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.emp-card summary::-webkit-details-marker{display:none}
.emp-card[open] summary{margin-bottom:10px}
.amt{font-family:var(--display);font-weight:600;color:var(--ink-strong)}
.plus{color:var(--good)} .minus{color:var(--bad)}
@media print{body *{visibility:hidden}#invPaper,#invPaper *,#slipPaper,#slipPaper *{visibility:visible}#invPaper,#slipPaper{position:absolute;left:0;right:0;top:0;border:0}#invPaper .btn{display:none!important}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  }

function distOf(cid){
  if(S.distDraft[cid])return S.distDraft[cid];
  const a=S.asg[cid];if(a)return{creator:(a.creator||[]).map(x=>({...x})),designer:a.designer||'',moderator:a.moderator||''};
  const r=S.recs.find(x=>x.clientId===cid),t=r?.mgmt?.team||{};
  return{creator:[{e:t.creator||'',from:1}],designer:t.designer||'',moderator:t.moderator||''};
}
function readDist(cid){const d=distOf(cid);
  d.creator=d.creator.map((x,i)=>({e:v(`dc_e_${cid}_${i}`),from:i?Math.max(2,n(`dc_f_${cid}_${i}`)||2):1}));
  d.designer=v('dd_'+cid);d.moderator=v('dm_'+cid);S.distDraft[cid]=d;return d}

async function rebuildMine(){
  const m=S.month,acc={};
  for(const a of Object.values(S.asg)){if(a.month!==m)continue;const c=a.clientName||cli(a.clientId)?.name||'';const segs=a.creator||[];
    segs.forEach((sg,i)=>{if(!sg.e)return;const to=i<segs.length-1?(+segs[i+1].from-1):null;(acc[sg.e]??=[]).push({c,r:'كريتور',from:+sg.from||1,to})});
    if(a.designer)(acc[a.designer]??=[]).push({c,r:'ديزاينر'});if(a.moderator)(acc[a.moderator]??=[]).push({c,r:'موديريتور'})}
  const bt=db.batch();S.emps.forEach(e=>bt.set(db.doc('mine/'+e.id),{byMonth:{[m]:acc[e.id]||[]}},{merge:true}));await bt.commit();
}

function shrinkImage(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{
  let W=im.naturalWidth,H=im.naturalHeight,max=1200;if(W>max){H=Math.round(H*max/W);W=max}
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;cv.getContext('2d').drawImage(im,0,0,W,H);
  let q=.82,d=cv.toDataURL('image/jpeg',q);while(d.length>700000&&q>.4){q-=.1;d=cv.toDataURL('image/jpeg',q)}
  if(d.length>900000){cv.width=Math.round(W*.6);cv.height=Math.round(H*.6);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);d=cv.toDataURL('image/jpeg',.7)}ok(d)};im.src=r.result};r.readAsDataURL(file)})}

function starRank(){
  const C=compute(),m=S.month,days=new Set(),start=START(),grace=GRACE();
  for(const log of Object.values(S.checks||{}))for(const[d,x]of Object.entries(log))if(d.startsWith(m)&&x.in&&!isFri(d))days.add(d);
  for(const d of Object.keys(S.att))if(!isFri(d))days.add(d);
  const W=days.size||1,meas={designer:C.out.designs,photographer:C.out.sessions,editor:C.out.videos,creator:C.out.creatorDays,moderator:C.out.modAcc},mx={};
  for(const[k,o]of Object.entries(meas))mx[k]=Math.max(0,...Object.values(o));
  const cov={};for(const dd of Object.values(S.att))for(const r of Object.values(dd.rows||{}))if(r.cover&&r.s!=='present')cov[r.cover]=(cov[r.cover]||0)+1;
  const maxCov=Math.max(0,...Object.values(cov)),rt=S.ratings||{};
  return S.emps.filter(e=>!isOwnerEmp(e)).map(e=>{
    let present=0,absent=0,hard=0,soft=0;
    for(const d of days){const x=S.checks?.[e.id]?.[d],r=S.att[d]?.rows?.[e.id];
      if(r&&r.s!=='present'){absent++;continue}
      if(x?.in||r?.s==='present'){present++;const k=lateKind(x?.in);if(k==='hard')hard++;else if(k==='soft')soft++}}
    const attR=Math.max(0,(present-0.25*hard-0.1*soft)/W),att=25*attR;
    const ratios=rolesOf(e).filter(k=>meas[k]&&mx[k]>0).map(k=>(meas[k][e.id]||0)/mx[k]);
    const prod=15*(ratios.length?ratios.reduce((a,b)=>a+b,0)/ratios.length:attR);
    const cv=maxCov?10*(cov[e.id]||0)/maxCov:0,tr=+rt.tl?.[e.id]||0,orr=+rt.owner?.[e.id]||0;
    return{e,present,absent,hard,soft,cov:cov[e.id]||0,att,prod,cv,tr,orr,total:att+prod+cv+25*tr/5+25*orr/5};
  }).sort((a,b)=>b.total-a.total);
}

  if(r.photo?.on)t+=`• باقة التصوير${r.photo.desc?` (${r.photo.desc})`:''}: ${money(r.photo.price)} ج.م\n`;
  freeOf(r).forEach(f=>t+=`• ${f.desc||'شغل إضافي'}: ${money(f.price)} ج.م\n`);

  if(+r.discount)t+=`• خصم: −${money(r.discount)} ج.م\n`;
  (r.subs||[]).filter(x=>+x.a).forEach(x=>t+=`• ${x.d||'خصم'}: −${money(x.a)} ج.م\n`);

const loadJs=src=>new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
async function invPdf(r,elId,fname){
  await loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const el=document.getElementById(elId||'invPaper');
  const cv=await html2canvas(el,{scale:2,backgroundColor:'#FFFFFF',ignoreElements:x=>x.classList&&x.classList.contains('btn'),windowWidth:420});
  const w=148,hh=cv.height*w/cv.width;
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:[w,hh]});
  pdf.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',0,0,w,hh);
  const name=fname||`فاتورة ${(cli(r.clientId)?.name||r.clientName||'').replace(/[\\/:*?"<>|]/g,'')} ${r.no}.pdf`;
  const blob=pdf.output('blob'),file=new File([blob],name,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name})}catch(e){if(e.name!=='AbortError')throw e}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('الـ PDF اتنزّل')}
}
function slipRows(C,id){
  const p=C.P[id];if(!p)return[];const rows=[],cov={};const dd=d=>d.slice(8)+'/'+d.slice(5,7);
  for(const l of p.lines){
    if(l.type==='cover'){const k=l.from;(cov[k]??={n:0,amt:0,from:l.from});cov[k].n++;cov[k].amt+=l.amt;continue}
    if(l.type==='design'){rows.push({t:`تصميم · ${l.client} (${l.n} تصميم من ${C.tgt})`,a:l.amt});continue}
    if(l.type==='absence'){rows.push({t:`${l.s==='leave'?'إجازة':'غياب'} يوم ${dd(l.date)}`,a:l.amt});continue}
    if(l.type==='late'){rows.push({t:`تأخير يوم ${dd(l.date)} (${l.t})`,a:l.amt});continue}
    rows.push({t:l.what,a:l.amt});
  }
  Object.values(cov).forEach(c=>rows.push({t:`تغطية مكان ${emp(c.from)?.name||''} (${c.n} يوم)`,a:c.amt}));
  if(p.round>0.5)rows.push({t:`تقريب لأقرب ${S.F.roundTo}`,a:p.round});
  return rows;
}

  if(a==='saveAtt'){const D=S.attDraft;document.querySelectorAll('[data-att]').forEach(el=>(D.rows[el.dataset.e]??={s:'present'})[el.dataset.att]=el.value||null);
    document.querySelectorAll('[data-dg]').forEach(el=>{const x=D.designs[+el.dataset.i];if(x)x[el.dataset.dg]=el.dataset.dg==='n'?+el.value||0:el.value});
    const rows={};S.emps.filter(e=>rolesOf(e).some(k=>DAILY.includes(k))).forEach(e=>{const r=D.rows[e.id]||{s:'present'};rows[e.id]={s:r.s||'present',work:r.work||'',cover:r.s!=='present'?(r.cover||null):null}});
    const designs=D.designs.filter(x=>x.e&&x.a&&+x.n>0).map(x=>({e:x.e,a:x.a,n:+x.n}));
    if(D.designs.some(x=>+x.n>0&&!x.a))return toast('اختار الأكونت لكل تصميمات');
    const prev=S.att[S.attDate];const body={date:S.attDate,rows,designs};if(prev?.demo)body.demo=true;
    if(await save(()=>db.doc('attendance/'+S.attDate).set(body),'شغل اليوم اتحفظ')){S.attDraft=null;document.activeElement?.blur();render()}return}
  if(a==='saveCfg'){const d={company:v('s_company'),vf:v('s_vf'),ip:v('s_ip'),ipLink:v('s_iplink'),note:v('s_note')};if(d.ipLink&&!/^https?:\/\//.test(d.ipLink))d.ipLink='https://'+d.ipLink;if(await save(()=>db.doc('cfg/settings').set(d,{merge:true}),'بيانات الدفع اتحفظت')){S.cfg={...S.cfg,...d};document.activeElement?.blur();render()}return}
  if(a==='saveFin'){const mg={},pp={};Object.keys(MG).forEach(k=>mg[k]=n('mp_'+k));Object.keys(PH).forEach(k=>pp[k]=n('pp_'+k));
    const d={mgmtPct:mg,photoPct:pp,mediaBuyerSalary:n('s_mb'),modBase:n('s_mbase'),modBaseAccounts:n('s_macc')||10,modExtra:n('s_mex'),monthDays:n('s_days')||30,designTarget:n('s_tgt')||8,roundTo:n('s_round'),
      photoPartner:v('s_pp')};
    if(await save(()=>db.doc('fin/main').set(d,{merge:true}),'اتحفظ')){S.F={...S.F,...d};document.activeElement?.blur();render()}return}
  if(a==='clearDemo'){b.disabled=true;const jobs=[...S.emps.filter(x=>x.demo).map(x=>db.doc('employees/'+x.id)),...S.clients.filter(x=>x.demo).map(x=>db.doc('clients/'+x.id))];
    const inv=await db.doc('fin/main').collection('invoices').where('demo','==',true).get();inv.docs.forEach(d=>jobs.push(db.doc('fin/main').collection('invoices').doc(d.id)));
    const at=await db.collection('attendance').where('demo','==',true).get();at.docs.forEach(d=>jobs.push(db.doc('attendance/'+d.id)));
    for(const r of jobs){try{await r.delete()}catch(_){}}toast('بيانات المثال اتمسحت');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='qa_name'){e.preventDefault();document.querySelector('[data-act="quickAdd"]')?.click()}});
try{const t=localStorage.getItem('tab');if(t)S.tab=t}catch(_){}
render();boot();
</script>
</body>
