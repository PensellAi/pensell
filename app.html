<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D42127">
<link rel="preload" href="/logo-l.png" as="image">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Pensell Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: sticky white header carrying the Pensell wordmark, tab rail, one working column; sheets slide up for editing */
:root{
  --bg:#F6F4F4; --surface:#FFFFFF; --ink:#3B3436; --ink-strong:#231E1F; --muted:#7A7072; --line:#E6E0E0;
  --accent:#D42127; --accent-ink:#FFFFFF; --accent-soft:#FBE7E7; --char:#3B3436; --char-ink:#FFFFFF;
  --gold:#A86A00; --gold-soft:#FBF0D9; --good:#1D7A48; --good-soft:#E1F2E8; --bad:#C0262C; --bad-soft:#FBE4E4; --shade:rgba(35,30,31,.45);
  --logo-l:block; --logo-d:none;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171314; --surface:#221D1E; --ink:#EDE7E7; --ink-strong:#FFFFFF; --muted:#A99FA0; --line:#3A3233;
  --accent:#F0443C; --accent-ink:#FFFFFF; --accent-soft:#3D1F1F; --char:#EDE7E7; --char-ink:#221D1E;
  --gold:#E5B04D; --gold-soft:#3A2E17; --good:#5CC98A; --good-soft:#163526; --bad:#F0726B; --bad-soft:#3D1D1D; --shade:rgba(0,0,0,.6);
  --logo-l:none; --logo-d:block; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171314; --surface:#221D1E; --ink:#EDE7E7; --ink-strong:#FFFFFF; --muted:#A99FA0; --line:#3A3233;
  --accent:#F0443C; --accent-ink:#FFFFFF; --accent-soft:#3D1F1F; --char:#EDE7E7; --char-ink:#221D1E;
  --gold:#E5B04D; --gold-soft:#3A2E17; --good:#5CC98A; --good-soft:#163526; --bad:#F0726B; --bad-soft:#3D1D1D; --shade:rgba(0,0,0,.6);
  --logo-l:none; --logo-d:block; color-scheme:dark}
html,body{background:var(--bg);margin:0}
body{overscroll-behavior-y:contain}
#ptr{position:fixed;top:0;left:50%;z-index:60;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.18);display:grid;place-items:center;color:var(--accent);font-size:20px;transform:translateY(-50px);pointer-events:none;opacity:0}
#ptr.go{color:var(--surface);background:var(--accent)}#ptr.spin span{animation:ptrs .8s linear infinite;display:inline-block}@keyframes ptrs{to{transform:rotate(360deg)}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.brand img{height:28px;width:auto}
.logo-l{display:var(--logo-l)} .logo-d{display:var(--logo-d)}
.brand small{font-size:12px;color:var(--muted);border-inline-start:1px solid var(--line);padding-inline-start:12px}
.month{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.month button{border:0;background:transparent;color:var(--ink);font-size:18px;width:32px;height:32px;border-radius:8px;cursor:pointer}
.month button:hover{background:var(--surface);color:var(--accent)}
.month span{font-family:var(--display);font-weight:600;min-width:118px;text-align:center}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--muted);font:500 14px var(--body);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink-strong);border-bottom-color:var(--accent);font-weight:600}
main{padding-block:20px 110px}
.fab{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;width:60px;height:60px;border-radius:50%;border:0;background:#D42127;box-shadow:0 8px 22px rgba(212,33,39,.35),0 2px 6px rgba(0,0,0,.15);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:34px;height:34px}
.fab-badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:#1FA855;color:#fff;font:600 12px var(--body);display:flex;align-items:center;justify-content:center;padding:0 6px;border:2px solid var(--bg)}
.fab-call{position:absolute;bottom:-2px;right:-2px;width:18px;height:18px;border-radius:50%;background:#1FA855;border:2px solid var(--bg)}
body.has-callbar .fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.callbar{position:fixed;left:0;right:0;bottom:0;z-index:14;background:#1D7A48;color:#fff;display:flex;gap:10px;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));font-size:14px}
.callbar .btn{background:#fff;color:#1D7A48;border-color:#fff}
.callbar .btn.leave{background:#C0262C;color:#fff;border-color:#C0262C}
.chat-h{display:flex;gap:6px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.chat-h .t{flex:1;min-width:0;font-family:var(--display);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{border:1px solid var(--line);background:var(--surface);color:var(--ink);height:36px;min-width:36px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;font:500 13px var(--body);cursor:pointer}
.ico.live{background:#1D7A48;color:#fff;border-color:#1D7A48}
.ico.red{background:#C0262C;color:#fff;border-color:#C0262C}
h2{font-family:var(--display);font-size:20px;margin:0;text-wrap:balance;color:var(--ink-strong)}
h3{font-family:var(--display);font-size:16px;margin:0;color:var(--ink-strong)}
h4{font-size:14px;margin:0;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.en-row{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.en-row .r{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.en-row .r>select,.en-row .r>input{flex:1 1 140px;min-width:0}.en-row .r>.x{flex:none}.en-row .r:first-child{flex-wrap:nowrap}.en-row .r:first-child>select{flex:1 1 0}
.xt summary,details.en-row summary{cursor:pointer;padding:2px 0}
.acc-t{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:10px;background:var(--bg)}
.pl-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.pl-wd{font-size:11px;color:var(--muted);text-align:center}
.pl-cell{min-height:56px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:3px;display:flex;flex-direction:column;align-items:stretch;gap:2px;cursor:pointer;font:inherit;color:var(--ink)}.pl-cell.fri{background:var(--bg);opacity:.75}.pl-cell.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}.pl-cell.today .pl-n{color:var(--accent);font-weight:700}
.pl-n{font-size:12px;text-align:start}.pl-dots{display:flex;flex-wrap:wrap;gap:2px}.pl-dots i{font-style:normal;color:#fff;font-size:9px;line-height:14px;min-width:14px;height:14px;border-radius:4px;text-align:center}
.pl-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px}.pl-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:middle}.pl-tag{color:#fff;border-radius:6px;padding:4px 8px;font-size:12px;flex:none}
.btn.xs{font-size:12px;padding:4px 9px;border-radius:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--body);padding:6px 12px;border-radius:16px;cursor:pointer}.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.conf{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line);padding-top:6px}
.qa-grid{display:grid;grid-template-columns:1fr;gap:10px}.qa-grid input,.qa-grid select{width:100%;min-width:0}
@media(min-width:760px){.qa-grid{grid-template-columns:1.3fr 1.3fr 1fr auto;align-items:end}}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.02em;color:var(--muted);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--body);padding:8px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dark{background:var(--char);color:var(--char-ink);border-color:var(--char)}
.btn.good{background:#1FA855;color:#fff;border-color:#1FA855}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile b{display:block;font-family:var(--display);font-size:22px;margin-top:4px;color:var(--ink-strong)}
.tile.hl{background:var(--char);border-color:var(--char);color:var(--char-ink)}
.tile.hl b,.tile.hl .label{color:var(--char-ink)}
.tile.hl .label{opacity:.75}
.tile.red b{color:var(--accent)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item .grow,.grow{flex:1;min-width:150px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.paid{background:var(--good-soft);color:var(--good)}
.pill.unpaid{background:var(--gold-soft);color:var(--gold)}
.pill.none{background:var(--bg);color:var(--muted)}
.pill.red{background:var(--accent-soft);color:var(--accent)}
.pkg{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.pkg.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.demo{font-size:11px;background:var(--gold-soft);color:var(--gold);padding:1px 7px;border-radius:6px;margin-inline-start:6px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg)}
.bar i{display:block;height:100%}
.att-nav{position:sticky;top:var(--navH,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0;margin:-4px 0;background:var(--bg)}.att-nav::-webkit-scrollbar{display:none}.att-nav .chip{flex:none}[id^=sec_]{scroll-margin-top:150px}
.today-t td{vertical-align:top}.today-t tr.sub td{padding-top:0;border-top:0}.today-it{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted)}.today-it .ok{color:var(--good)}.today-msg{font-size:13px;padding:6px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);margin-bottom:4px}.today-msg .tick{margin-inline-start:6px;opacity:.6}.today-msg.seen .tick{opacity:1}.today-msg.seen{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}.today-it .no{color:var(--bad)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 16px;margin-top:12px}
.legend div{display:flex;gap:8px;align-items:center;font-size:13px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span:last-child{margin-inline-start:auto}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);padding:0}
textarea{resize:vertical;min-height:40px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;font:500 13px var(--body);color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink-strong);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button.on.a{color:var(--bad)}
.seg button.on.p{color:var(--good)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h3{margin-bottom:6px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px}
.notice{background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}
.sec{border:1px solid var(--line);border-radius:12px;padding:14px}
.sec.off{background:var(--bg)}
.sec-h{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sec-h label{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;cursor:pointer}
details.pct summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:500;margin-top:10px}
details.pct[open] summary{margin-bottom:10px}
.mini{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px}
.mini span:nth-child(even){text-align:left}
.mini .tot{font-weight:600;border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
.lst{display:flex;flex-direction:column;gap:6px}
.lst .r{display:flex;gap:6px}
.lst .r>*{flex:1}
.lst .r .x,.lst .r input[type=number]{flex:0 0 auto}
.lst .r input[type=number]{width:80px}
/* sheet */
.shade{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
@media(min-width:800px){.shade{align-items:center}.sheet{border-radius:18px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.x{border:0;background:var(--bg);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
/* invoice paper: always a white printed document */
.paper{background:#FFFFFF;color:#3B3436;border:1px solid #E6E0E0;border-radius:14px;overflow:hidden}
.paper-h{padding:20px 18px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:4px solid #D42127}
.paper-h img{height:30px;width:auto}
.paper-h .meta{text-align:left;font-size:13px;color:#7A7072}
.paper-h .meta b{color:#231E1F}
.paper-b{padding:16px 18px}
.paper table th,.paper table td{border-color:#EEE8E8}
.paper th{color:#7A7072}
.paper .lbl{font-size:12px;color:#7A7072}
.paper .desc{font-size:12px;color:#7A7072}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #231E1F;padding-top:10px;margin-top:6px}
.total b{font-family:var(--display);font-size:24px;color:#D42127}
.pay{display:grid;gap:8px;margin-top:14px}
.payrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#F6F4F4;border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.payrow b{font-family:var(--display);color:#231E1F}
.payrow .btn{background:#FFFFFF;color:#3B3436;border-color:#E6E0E0}
.payrow .btn.primary{background:#D42127;color:#fff;border-color:#D42127}
.install{display:flex;gap:10px;align-items:center;background:var(--char);color:var(--char-ink);padding:10px max(16px,env(safe-area-inset-left,0px));font-size:14px}
.install b{font-weight:600}.install .grow{flex:1;min-width:0}.install .btn{background:var(--accent);color:#fff;border-color:var(--accent)}.install .x{background:transparent;color:var(--char-ink)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--char);color:var(--char-ink);padding:10px 16px;border-radius:10px;z-index:40;font-size:14px}
.emp-card summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.emp-card summary::-webkit-details-marker{display:none}
.emp-card[open] summary{margin-bottom:10px}
.amt{font-family:var(--display);font-weight:600;color:var(--ink-strong)}
.plus{color:var(--good)} .minus{color:var(--bad)}
@media print{body *{visibility:hidden}#invPaper,#invPaper *,#slipPaper,#slipPaper *{visibility:visible}#invPaper,#slipPaper{position:absolute;left:0;right:0;top:0;border:0}#invPaper .btn{display:none!important}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><img class="logo-l" src="/logo-l.png" alt="Pensell"><img class="logo-d" src="/logo-d.png" alt="Pensell"><small id="who"></small><button id="signout" class="btn sm ghost" data-act="signout" hidden>خروج</button></div>
      <div class="month" id="monthBox"><button data-act="mPrev" aria-label="الشهر اللي فات">›</button><span id="mLabel"></span><button data-act="mNext" aria-label="الشهر الجاي">‹</button></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<div id="installBar" hidden></div>
<main class="wrap" id="main"><div class="empty"><h3>بيحمّل البيانات…</h3></div></main>

async function purgeClient(cid){if(!S.fin||!cid)return;const bt=db.batch();bt.delete(db.doc('clients/'+cid));bt.delete(db.doc('briefs/'+cid));

async function cleanClients(){if(!S.fin||S.cleaned||!S.clients?.length||!S.emps.length)return;S.cleaned=1;
  try{const RX=/[اأ]تيلي[هة] ?ال[اأ]سطور/,cs=await db.collection('clients').get({source:'server'}),ids=new Set(cs.docs.map(d=>d.id)),dead=new Set(['mnijcrt9']);cs.docs.forEach(d=>{if(RX.test(d.data().name||''))dead.add(d.id)});
    const q=await db.collection('assign').get({source:'server'}),orph=new Set();q.docs.forEach(d=>{const x=d.data();if(!x.clientId)return;if(RX.test(x.clientName||''))dead.add(x.clientId);else if(!ids.has(x.clientId))orph.add(x.clientId)});
    for(const cid of dead)if(ids.has(cid)||q.docs.some(d=>d.data().clientId===cid))await purgeClient(cid);
    // عميل اتمسح زمان: بنشيل توزيعه بس علشان مايظهرش للفريق (الفواتير بتفضل زي ما هي)
    if(orph.size){const bt=db.batch();q.docs.forEach(d=>{if(orph.has(d.data().clientId))bt.delete(d.ref)});await bt.commit();orph.forEach(c=>delete S.asg[c]);await rebuildMine()}}catch(e){console.warn('cleanClients',e)}}

function starRank(){
  const C=compute(),M=monthSum(),rows=Object.values(M.rows);
  const meas={designer:'designs',creator:'posts',photographer:'sessions',editor:'videos',moderator:'mods'},mx={};
  ['designs','posts','mods','sessions','videos','tasks','other'].forEach(k=>mx[k]=Math.max(0,...rows.map(r=>r.eff[k])));
  const cov={};for(const dd of Object.values(S.att))for(const r of Object.values(dd.rows||{}))if(r.cover&&r.s!=='present')cov[r.cover]=(cov[r.cover]||0)+1;
  const maxCov=Math.max(0,...Object.values(cov)),rt=S.ratings||{};
  return rows.map(R=>{const e=R.e,E=R.eff,W=(E.present+E.absent)||M.days||1;
    const attR=Math.max(0,Math.min(1,(E.present-0.25*R.hard-0.1*R.soft)/W)),att=20*attR;
    const mt=S.mTasks?.[e.id],tk=10*(mt&&mt.all?mt.done/mt.all:attR);
    const pq=repReq(e.id,S.month),pl=10*(pq.length?pq.reduce((a,cid)=>{const P=S.plans?.[planId(S.month,cid)];return a+(planOnTime(P)?0.5*planEarly(P)+0.5*(+P.rating||3)/5:0)},0)/pq.length:attR);
    const rq=repReq(e.id,S.month),rep=10*(rq.length?rq.filter(cid=>repOnTime(S.reps?.[repId(S.month,cid,e.id)])).length/rq.length:attR);
    const keys=[...new Set([...rolesOf(e).map(k=>meas[k]).filter(Boolean),'other'])].filter(k=>mx[k]>0);
    const prod=20*(keys.length?keys.reduce((a,k)=>a+E[k]/mx[k],0)/keys.length:attR);
    const cv=maxCov?10*(cov[e.id]||0)/maxCov:0,tr=+rt.tl?.[e.id]||0,orr=+rt.owner?.[e.id]||0;
    return{e,present:E.present,absent:E.absent,hard:R.hard,soft:R.soft,cov:cov[e.id]||0,att,prod,tk,cv,pl,rep,tr,orr,total:att+prod+tk+cv+pl+rep+20*orr/5};
  }).sort((a,b)=>b.total-a.total);
}

// الأكونتات المتوزعة على موظف في الشهر ده
function accsFor(eid,role,day){return Object.values(S.asg||{}).filter(a=>{if(a.month!==S.month)return false;const segs=role==='creator'?a.creator||[]:role==='designer'?dSegs(a):null;if(!segs)return a[role]===eid;return day?segAt(segs,day)?.e===eid:segs.some(x=>x.e===eid)}).map(a=>a.clientId)}
const clName=id=>cli(id)?.name||'';
function taskLabel(k,x){const c=clName(x.a),cv=x.cv?' · مكان '+(emp(x.cv)?.name||''):'';
  return k==='posts'||k==='designs'?`${x.t} · ${c}${cv}${x.idea?' — '+x.idea:''}`:k==='shoots'?`تصوير · ${c}${x.n?' · '+x.n+' فيديو':''}`:k==='edits'?`مونتاج · ${c} · ${x.n||1} فيديو`:`تمويل بوست · ${c} · ${money(x.amt)} ج`}
// مهام تانية ورسالة لكل موظف (بتتحفظ في مهامه)
const xtraOf=id=>{const T=S.tasks[id];return{t:(T?.items||[]).filter(x=>!x.k||x.k==='x').map(x=>x.t).join('\n'),msg:T?.msg||''}};
const xtraD=id=>S.attDraft.extra[id]??=xtraOf(id);
function vAtt(){
  const d=S.attDate,day=S.att[d]||{};

  if(!S.attDraft||S.attDraft.date!==d||(!S.attDraft.dirty&&(S.attDraft.src!==S.att[d]||(!S.att[d]&&S.attDraft.pl!==S.plans)))){
    const D={date:d,src:S.att[d],mods:JSON.parse(JSON.stringify(day.mods||{})),extra:{},covers:JSON.parse(JSON.stringify(day.covers||[]))};
    for(const k of Object.keys(EN))D[k]=JSON.parse(JSON.stringify(day[k]||[]));
    D.pl=S.plans;if(!S.att[d])planFill(D,d);
    S.emptyMods=!day.mods;S.attDraft=D;
  }
  const D=S.attDraft;
  if(!S.emps.length)return `<div class="panel empty"><h3>مفيش موظفين لسه</h3><p>${S.fin?'ضيف الفريق من تبويب «الفريق» الأول.':'الإدارة لسه ماضافتش الفريق.'}</p></div>`;
  const saved=!!S.att[d],accs=S.clients.filter(c=>c.active!==false),mods=S.emps.filter(e=>has(e,'moderator'));
  const empOpts=(sel,ex)=>`<option value="">محدش</option>`+S.emps.filter(x=>x.id!==ex).map(x=>`<option value="${x.id}" ${sel===x.id?'selected':''}>${h(x.name)} — ${h(rolesTxt(x))}</option>`).join('');
  const people=roles=>[...S.emps.filter(e=>roles.some(r=>has(e,r))),...S.emps.filter(e=>!roles.some(r=>has(e,r)))];
  const pend=Object.keys(EN).reduce((s,k)=>s+(D[k]||[]).filter(x=>x.e&&x.a&&x.ok!==true&&x.ok!==false).length,0);
  const at=(k,f,i)=>`id="en_${k}_${f}_${i}" data-en="${k}" data-f="${f}" data-i="${i}"`;
  // سطر التأكيد تحت كل مهمة: الموظف علّم؟ + تم فعلاً / متمّتش + السبب
  const conf=(k,c,x,i)=>{const ti=x.id&&(S.tasks[x.e]?.items||[]).find(y=>y.id===x.id),eDone=!!ti?.done;
    return `<div class="row between" style="gap:6px"><span class="small ${eDone?'':'muted'}" style="${eDone?'color:var(--good)':''}">${!x.id?'لسه ماتحفظتش':eDone?'الموظف علّم إنها خلصت ✓':'الموظف لسه ماعلّمش'}</span>
      <div class="seg">${[[true,'تم فعلاً ✓','p'],[false,'متمّتش','a']].map(([v,nm,cl])=>`<button class="${x.ok===v?'on '+cl:''}" data-act="enOk" data-k="${k}" data-i="${i}" data-v="${v?1:0}">${nm}</button>`).join('')}</div></div>
     ${x.ok===false&&c.cover?`<div class="r"><select ${at(k,'by',i)} aria-label="السبب من مين"><option value="">السبب منه هو · بتتخصم</option>${S.emps.filter(p=>p.id!==x.e).map(p=>`<option value="${p.id}" ${x.by===p.id?'selected':''}>تأخير من ${h(p.name)} · مش بتتخصم منه</option>`).join('')}</select><input ${at(k,'why',i)} placeholder="السبب (مثلاً: الديزاين اتأخر)" value="${h(x.why||'')}" aria-label="السبب"></div>`:''}`};
  const dayN=d.slice(0,7)===S.month?+d.slice(8):0;

  const xCard=eid=>S.xCard?.[eid]||cardsOf(eid)[0];

  const tools=(eid,k,first)=>`<div class="row between" style="gap:6px"><div class="row" style="gap:4px">${first||''}<button class="btn xs" data-act="xAdd" data-e="${eid}" data-k="${k}" data-w="t">+ مهمة تانية</button><button class="btn xs" data-act="xAdd" data-e="${eid}" data-k="${k}" data-w="m">+ ملاحظة</button></div><button class="btn sm primary" data-act="saveAtt">حفظ</button></div>`;

     ${(D.covers||[]).map((C,ci)=>hostOf(C)===k&&C.e===e.id?coverUI(ci,1):'').join('')}
     ${extraUI(e.id,k)}${tools(e.id,k,`<button class="btn xs" data-act="cvAdd" data-host="${k}" data-e="${e.id}">+ تغطية</button>`)}</div>`};
  // التصوير والمونتاج والإعلانات: سطور (الموظف / الأكونت / العدد أو اللينك والمبلغ)

       ${c.amt?`<input ${at(k,'amt',i)} type="number" min="0" inputmode="numeric" placeholder="المبلغ" value="${x.amt??''}" aria-label="المبلغ" style="width:110px">`:''}</div>

  const block=(k,c)=>{if(!c.asg)return freeBlock(k,c);const ppl=pplOf(k,c);return `<div class="panel" id="sec_${k}"><h3>${c.title}</h3><p class="small muted" style="margin:4px 0 10px">${c.hint}</p>

  // كارت التغطية: الموظف (من التيم كله) / غطّى مكان مين / أكونتات اللي غاب والمطلوب منها / ملاحظة
  D.covers??=[];for(const k of ['posts','designs'])for(const x of D[k]||[])if(x.cv&&!D.covers.some(p=>p.e===x.e&&p.cv===x.cv))D.covers.push({e:x.e,cv:x.cv});
  const hostOf=C=>C.host||(C.e&&pplOf('posts',EN.posts).some(e=>e.id===C.e)?'posts':C.e&&pplOf('designs',EN.designs).some(e=>e.id===C.e)?'designs':'panel');
  const coverUI=(ci,fixed)=>{const C=D.covers[ci];const ab=C.cv?emp(C.cv):null;let body='';

  const w=148,hh=cv.height*w/cv.width;
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:[w,hh]});
  pdf.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',0,0,w,hh);
  const name=fname||`فاتورة ${(cli(r.clientId)?.name||r.clientName||'').replace(/[\\/:*?"<>|]/g,'')} ${r.no}.pdf`;

function accLabel(l,C){if(l.type==='deliv')return `كريتور ${l.kind} (${l.n} من ${l.target})`;if(l.type==='design')return `ديزاين (${l.n} من ${l.target||C?.tgt||8})`;return String(l.what||'').replace(' · '+l.acc,'').replace(l.acc+' · ','')}
const accFull=l=>(l.type==='deliv'||l.type==='design')?(l.tot?l.share*l.n/l.tot:l.share):l.amt;
function groupLines(lines,C){const g={},rest=[];for(const l of lines){if(l.type==='cover')continue;if(l.acc){const x=(g[l.acc]??={acc:l.acc,amt:0,full:0,parts:[]});x.amt+=l.amt;x.full+=accFull(l);x.parts.push({label:accLabel(l,C),amt:l.amt})}else rest.push(l)}return{groups:Object.values(g),rest}}
function slipRows(C,id){
  const p=C.P[id];if(!p)return[];const rows=[],cov={};const dd=d=>d.slice(8)+'/'+d.slice(5,7);
  groupLines(p.lines,C).groups.forEach(x=>rows.push({t:x.acc,a:x.amt}));
  for(const l of p.lines){if(l.acc)continue;
    if(l.type==='cover'){const k=l.from;(cov[k]??={n:0,amt:0,from:l.from});cov[k].n++;cov[k].amt+=l.amt;continue}
    if(l.type==='design'){rows.push({t:`تصميم · ${l.client} (${l.n} من ${l.target||C.tgt})`,a:l.amt});continue}
    if(l.type==='deliv'){rows.push({t:`${l.kind} · ${l.client} (${l.n} من ${l.target})`,a:l.amt});continue}
    if(l.type==='absence'){rows.push({t:`${l.s==='leave'?'إجازة':'غياب'} يوم ${dd(l.date)}`,a:l.amt});continue}
    if(l.type==='sumadj'){rows.push({t:l.what,a:l.amt});continue}
    if(l.type==='noclose'){rows.push({t:`ماقفلش المتابعة يوم ${dd(l.date)}`,a:l.amt});continue}
    if(l.type==='late'){rows.push({t:`تأخير يوم ${dd(l.date)} (${l.t})`,a:l.amt});continue}
    rows.push({t:l.what,a:l.amt});
  }
  Object.values(cov).forEach(c=>rows.push({t:`تغطية مكان ${emp(c.from)?.name||''} (${c.n} يوم)`,a:c.amt}));
  if(Math.abs(p.round)>0.5)rows.push({t:p.fixed?'تعديل المرتب':`تقريب لأقرب ${S.F.roundTo}`,a:p.round});
  return rows;
}

<script>

(()=>{const el=document.getElementById('ptr'),TH=80;let y0=null,dy=0,busy=false;

  const reset=()=>{el.style.transition='transform .2s,opacity .2s';set(0);setTimeout(()=>el.style.transition='',220)};
  addEventListener('touchstart',e=>{if(busy||e.touches.length!==1||window.scrollY>0||blocked(e.target)){y0=null;return}y0=e.touches[0].clientY;dy=0},{passive:true});
